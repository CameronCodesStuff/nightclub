<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🎵 Idle Nightclub</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    margin:0;
    padding:20px;
}

h1{
    color:#ff2d75;
}

.card{
    background:#222;
    max-width:900px;
    margin:15px auto;
    padding:15px;
    border-radius:12px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
    max-width:900px;
    margin:auto;
}

.upgradeCard{
    background:#222;
    padding:15px;
    border-radius:12px;
}

button{
    background:#ff2d75;
    color:white;
    border:none;
    padding:10px;
    width:140px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

/* CLUB */

#club{
    width:800px;
    height:450px;
    margin:auto;
    position:relative;
    overflow:hidden;
    border-radius:20px;
    background:#1a1a1a;
    border:4px solid #444;
    box-shadow:0 0 30px #ff2d75;
}

.danceFloor{
    position:absolute;
    width:350px;
    height:220px;
    left:225px;
    top:170px;

    border:4px solid white;

    background:
    repeating-linear-gradient(
        45deg,
        #ff2d75 0px,
        #ff2d75 20px,
        #00ffff 20px,
        #00ffff 40px
    );

    animation:flashFloor .7s infinite;
}

.djBooth{
    position:absolute;
    width:220px;
    height:80px;
    left:290px;
    top:30px;

    background:#000;

    border:3px solid #ff2d75;

    border-radius:12px;

    animation:boothPulse 1.5s infinite;
}

.dj{
    font-size:40px;
    line-height:80px;

    animation:djDance .8s infinite;
}

.bar{
    position:absolute;
    left:20px;
    top:140px;

    width:150px;
    height:220px;

    background:#663300;

    border:4px solid white;

    line-height:220px;

    font-weight:bold;

    animation:barGlow 2s infinite;
}

.vip{
    position:absolute;
    right:20px;
    top:140px;

    width:150px;
    height:220px;

    background:#550055;

    border:4px solid gold;

    color:gold;

    line-height:220px;

    font-weight:bold;

    animation:vipGlow 2s infinite;
}

.speaker{
    position:absolute;

    width:60px;
    height:120px;

    background:#111;

    border:3px solid #00ffff;

    top:30px;

    animation:speakerPulse .5s infinite;
}

.leftSpeaker{
    left:180px;
}

.rightSpeaker{
    right:180px;
}

#crowd{
    position:absolute;
    left:240px;
    top:190px;
    width:320px;
    height:180px;
}

.disco{
    position:absolute;
    width:15px;
    height:15px;
    border-radius:50%;
    animation:floatLight 4s linear infinite;
}

.laser{
    position:absolute;
    width:4px;
    height:450px;
    opacity:.6;
}

.l1{
    background:red;
    left:250px;
    animation:laser1 2s infinite;
}

.l2{
    background:#00ffff;
    left:400px;
    animation:laser2 3s infinite;
}

.l3{
    background:#00ff00;
    left:550px;
    animation:laser3 2.5s infinite;
}

/* ANIMATIONS */

@keyframes flashFloor{
    0%{filter:brightness(1);}
    50%{filter:brightness(2);}
    100%{filter:brightness(1);}
}

@keyframes boothPulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.05);}
    100%{transform:scale(1);}
}

@keyframes djDance{
    0%{transform:rotate(-8deg);}
    50%{transform:rotate(8deg);}
    100%{transform:rotate(-8deg);}
}

@keyframes speakerPulse{
    0%{box-shadow:0 0 10px #00ffff;}
    50%{box-shadow:0 0 30px #00ffff;}
    100%{box-shadow:0 0 10px #00ffff;}
}

@keyframes vipGlow{
    0%{box-shadow:0 0 10px gold;}
    50%{box-shadow:0 0 30px gold;}
    100%{box-shadow:0 0 10px gold;}
}

@keyframes barGlow{
    0%{filter:brightness(1);}
    50%{filter:brightness(1.5);}
    100%{filter:brightness(1);}
}

@keyframes laser1{
    0%{transform:rotate(-40deg);}
    50%{transform:rotate(40deg);}
    100%{transform:rotate(-40deg);}
}

@keyframes laser2{
    0%{transform:rotate(30deg);}
    50%{transform:rotate(-30deg);}
    100%{transform:rotate(30deg);}
}

@keyframes laser3{
    0%{transform:rotate(-20deg);}
    50%{transform:rotate(20deg);}
    100%{transform:rotate(-20deg);}
}

@keyframes floatLight{
    from{
        transform:translateY(350px);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:1;
    }

    to{
        transform:translateY(-100px);
        opacity:0;
    }
}

@keyframes bounce{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}

</style>

</head>
<body>

<h1>🎵 Idle Nightclub</h1>

<div class="card">
<h2>💰 Cash: $<span id="cash">0</span></h2>
<p>📈 Income/Sec: $<span id="income">1</span></p>
<p>👥 Customers: <span id="customers">0</span></p>
<p>⭐ Multiplier: x<span id="multiplier">1.0</span></p>
</div>

<div class="card">

<div id="club">

<div class="danceFloor"></div>

<div class="speaker leftSpeaker"></div>
<div class="speaker rightSpeaker"></div>

<div class="djBooth">
<div class="dj">😎🎧</div>
</div>

<div class="bar">🍸 BAR</div>

<div class="vip">⭐ VIP</div>

<div class="laser l1"></div>
<div class="laser l2"></div>
<div class="laser l3"></div>

<div class="disco" style="left:100px;background:red;"></div>
<div class="disco" style="left:250px;background:cyan;animation-delay:1s;"></div>
<div class="disco" style="left:450px;background:yellow;animation-delay:2s;"></div>
<div class="disco" style="left:650px;background:lime;animation-delay:3s;"></div>

<div id="crowd"></div>

</div>

</div>

<div class="grid">

<div class="upgradeCard">
<h2>🍸 Bar</h2>
<p>Level: <span id="barLevel">0</span></p>
<p>Cost: $<span id="barCost">10</span></p>
<button onclick="upgradeBar()">Upgrade</button>
</div>

<div class="upgradeCard">
<h2>🎧 DJ Booth</h2>
<p>Level: <span id="djLevel">0</span></p>
<p>Cost: $<span id="djCost">25</span></p>
<button onclick="upgradeDJ()">Upgrade</button>
</div>

<div class="upgradeCard">
<h2>⭐ VIP Lounge</h2>
<p>Level: <span id="vipLevel">0</span></p>
<p>Cost: $<span id="vipCost">100</span></p>
<button onclick="upgradeVIP()">Upgrade</button>
</div>

<div class="upgradeCard">
<h2>📣 Invite</h2>
<p>Customer stays 15 sec</p>
<button onclick="inviteCustomer()">Invite</button>
</div>

</div>

<div class="card">
<button onclick="cash+=1000;updateScreen();">
💵 Add $1000
</button>
</div>

<script>

let cash=0;

let customers=0;
let multiplier=1;

let barLevel=0;
let djLevel=0;
let vipLevel=0;

let barCost=10;
let djCost=25;
let vipCost=100;

function incomePerSecond(){
    return 1 +
        (barLevel*1) +
        (djLevel*2) +
        (vipLevel*5);
}

function recalc(){
    multiplier =
        1 + (customers*0.10);
}

function updateCrowd(){

    let html="";

    const dancers=["🕺","💃"];

    for(let i=0;i<customers;i++){

        let x=(i%5)*55;
        let y=Math.floor(i/5)*45;

        html+=`
        <div style="
        position:absolute;
        left:${x}px;
        top:${y}px;
        font-size:28px;
        animation:bounce ${0.5+Math.random()}s infinite;">
        ${dancers[Math.floor(Math.random()*2)]}
        </div>`;

        if(i>24) break;
    }

    document.getElementById("crowd").innerHTML=html;
}

function updateScreen(){

    document.getElementById("cash").innerText=Math.floor(cash);
    document.getElementById("income").innerText=Math.floor(incomePerSecond()*multiplier);
    document.getElementById("customers").innerText=customers;
    document.getElementById("multiplier").innerText=multiplier.toFixed(1);

    document.getElementById("barLevel").innerText=barLevel;
    document.getElementById("djLevel").innerText=djLevel;
    document.getElementById("vipLevel").innerText=vipLevel;

    document.getElementById("barCost").innerText=barCost;
    document.getElementById("djCost").innerText=djCost;
    document.getElementById("vipCost").innerText=vipCost;

    updateCrowd();
}

function upgradeBar(){

    if(cash>=barCost){

        cash-=barCost;
        barLevel++;
        customers++;

        barCost=
            Math.floor(
                10*Math.pow(1.5,barLevel)
            );

        recalc();
        updateScreen();
    }
}

function upgradeDJ(){

    if(cash>=djCost){

        cash-=djCost;
        djLevel++;
        customers++;

        djCost=
            Math.floor(
                25*Math.pow(1.65,djLevel)
            );

        recalc();
        updateScreen();
    }
}

function upgradeVIP(){

    if(cash>=vipCost){

        cash-=vipCost;
        vipLevel++;
        customers++;

        vipCost=
            Math.floor(
                100*Math.pow(2,vipLevel)
            );

        recalc();
        updateScreen();
    }
}

function inviteCustomer(){

    customers++;

    recalc();
    updateScreen();

    setTimeout(()=>{

        customers--;

        if(customers<0){
            customers=0;
        }

        recalc();
        updateScreen();

    },15000);

}

setInterval(()=>{

    cash+=
        incomePerSecond()
        *multiplier;

    updateScreen();

},1000);

updateScreen();

</script>

</body>
</html>
